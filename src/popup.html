<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sesli Oku</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body data-theme="modern">
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <path
            d="M4 9.5v5h3.2L12 18V6L7.2 9.5H4z"
            fill="currentColor"
          />
          <path
            d="M15 8.4a5 5 0 0 1 0 7.2M17.6 5.8a8.6 8.6 0 0 1 0 12.4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </div>
      <div>
        <h1>Sesli Oku</h1>
        <p>Edge Read Aloud, Linux'ta</p>
      </div>
    </header>

    <div class="actions">
      <button id="read-page" class="primary">Sayfayı oku</button>
      <button id="read-selection" class="secondary">Seçimi oku</button>
      <button id="read-here" class="secondary full">İmleçten oku</button>
    </div>

    <section id="preferences" aria-label="Okuma ayarları"></section>

    <div class="status" id="status" role="status"></div>

    <footer>
      <span title="R: sayfa, S: seçim, H: imleç"
        >Kısayollar: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R/S/H</kbd></span
      >
      <button id="stop" class="link">Durdur</button>
    </footer>

    <script src="themes.js"></script>
    <script src="library.js"></script>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
